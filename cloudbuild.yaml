steps:
  # Build Docker image using Dockerfile (same as local)
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/brave-search-mcp-wrapper:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/brave-search-mcp-wrapper:latest'
      - '.'
  
  # Push to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/brave-search-mcp-wrapper:$COMMIT_SHA'
  
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/brave-search-mcp-wrapper:latest'
  
  # Deploy to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'brave-search-mcp-wrapper'
      - '--image=gcr.io/$PROJECT_ID/brave-search-mcp-wrapper:$COMMIT_SHA'
      - '--platform=managed'
      - '--region=us-central1'
      - '--allow-unauthenticated'
      - '--min-instances=0'
      - '--max-instances=10'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--timeout=60s'
      - '--set-env-vars=NODE_ENV=production,PLATFORM_URL=${_PLATFORM_URL},CORS_ORIGIN=${_CORS_ORIGIN}'
      - '--update-secrets=PLATFORM_SERVICE_TOKEN=brave-search-platform-service-token:latest,BRAVE_API_KEY=brave-search-brave-api-key:latest'

images:
  - 'gcr.io/$PROJECT_ID/brave-search-mcp-wrapper:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/brave-search-mcp-wrapper:latest'

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY
