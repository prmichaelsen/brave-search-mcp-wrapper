# General notes and observations
notes:
  - Implementation follows remember-mcp-server pattern (simpler than agentbase-mcp-server)
  - Brave Search server exports createMcpServer function that takes config with braveApiKey
  - No separate token resolver needed - mcp-auth handles it via resourceType
  - Platform API will be called by mcp-auth framework to get user's Brave API key
  - TypeScript type declarations created for @brave/brave-search-mcp-server
  - All deployment configuration is ready - just needs deployment execution

